<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity Invoice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@100;200;300;400;500;600&family=Outfit:wght@100;200;300;400;500&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            display: ['Barlow Condensed', 'sans-serif'],
          },
          colors: {
            primary: '#84cc16', // Lime 500
            dark: {
              950: '#020617', // Slate 950
              900: '#0f172a', // Slate 900
              800: '#1e293b', // Slate 800
            }
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            'lime-glow': 'conic-gradient(from 180deg at 50% 50%, #84cc1620 0deg, #00000000 360deg)',
          }
        },
      },
    }
  </script>
  <style>
    /* Print styles for PDF generation fallback */
    @media print {
      body * {
        visibility: hidden;
      }

      #invoice-preview-container,
      #invoice-preview-container * {
        visibility: visible;
      }

      #invoice-preview-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
        border: none;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #020617;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #84cc16;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 7px 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.08);
      color: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .theme-toggle:hover {
      background: rgba(148, 163, 184, 0.16);
      border-color: rgba(148, 163, 184, 0.35);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid #84cc16;
      outline-offset: 2px;
    }

    /* Light theme for the app chrome. The invoice preview keeps its own paper. */
    html[data-theme='light'] body {
      background: #eef2f7;
      color: #0f172a;
    }

    html[data-theme='light'] ::selection {
      background: rgba(132, 204, 22, 0.25);
      color: #1a2e05;
    }

    html[data-theme='light'] ::-webkit-scrollbar-track {
      background: #e2e8f0;
    }

    html[data-theme='light'] ::-webkit-scrollbar-thumb {
      background: #94a3b8;
    }

    html[data-theme='light'] [class*='bg-slate-950']:not(#invoice-preview-container *) {
      background-color: #eef2f7 !important;
    }

    html[data-theme='light'] [class*='bg-slate-900']:not(#invoice-preview-container *) {
      background-color: rgba(255, 255, 255, 0.72) !important;
    }

    html[data-theme='light'] [class*='bg-slate-800']:not(#invoice-preview-container *) {
      background-color: #e2e8f0 !important;
    }

    html[data-theme='light'] [class*='bg-slate-700']:not(#invoice-preview-container *) {
      background-color: #cbd5e1 !important;
    }

    html[data-theme='light'] [class*='bg-white/']:not(#invoice-preview-container *) {
      background-color: rgba(15, 23, 42, 0.035) !important;
    }

    html[data-theme='light'] [class*='bg-black/']:not(#invoice-preview-container *) {
      background-color: rgba(255, 255, 255, 0.72) !important;
    }

    html[data-theme='light'] [class*='border-white/']:not(#invoice-preview-container *) {
      border-color: rgba(15, 23, 42, 0.1) !important;
    }

    html[data-theme='light'] [class*='border-slate-800']:not(#invoice-preview-container *),
    html[data-theme='light'] [class*='border-slate-700']:not(#invoice-preview-container *) {
      border-color: #d7dfe9 !important;
    }

    html[data-theme='light'] [class*='divide-white/']:not(#invoice-preview-container *) {
      border-color: rgba(15, 23, 42, 0.08) !important;
    }

    html[data-theme='light'] [class*='text-white']:not(#invoice-preview-container *) {
      color: #0f172a !important;
    }

    html[data-theme='light'] [class*='text-slate-100']:not(#invoice-preview-container *),
    html[data-theme='light'] [class*='text-slate-200']:not(#invoice-preview-container *) {
      color: #0f172a !important;
    }

    html[data-theme='light'] [class*='text-slate-300']:not(#invoice-preview-container *) {
      color: #334155 !important;
    }

    html[data-theme='light'] [class*='text-slate-400']:not(#invoice-preview-container *) {
      color: #475569 !important;
    }

    html[data-theme='light'] [class*='text-slate-500']:not(#invoice-preview-container *) {
      color: #52606f !important;
    }

    html[data-theme='light'] [class*='text-slate-600']:not(#invoice-preview-container *) {
      color: #334155 !important;
    }

    html[data-theme='light'] [class*='text-lime-400']:not(#invoice-preview-container *),
    html[data-theme='light'] [class*='text-lime-500']:not(#invoice-preview-container *),
    html[data-theme='light'] [class*='text-lime-300']:not(#invoice-preview-container *) {
      color: #4d7c0f !important;
    }

    html[data-theme='light'] [class*='text-amber-400']:not(#invoice-preview-container *) {
      color: #a16207 !important;
    }

    html[data-theme='light'] [class*='placeholder:text-slate-']:not(#invoice-preview-container *)::placeholder {
      color: #8b98a8 !important;
    }

    html[data-theme='light'] [class*='color-scheme:dark']:not(#invoice-preview-container *) {
      color-scheme: light !important;
    }

    html[data-theme='light'] #invoice-preview-container {
      color-scheme: light;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('clarity.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (error) {}
    })();
  </script>
</head>

<body
  class="bg-slate-950 text-slate-200 antialiased selection:bg-lime-500/30 selection:text-lime-200 font-sans overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
