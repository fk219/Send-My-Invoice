services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clarity
      POSTGRES_PASSWORD: clarity
      POSTGRES_DB: clarity
    volumes:
      - clarity-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarity -d clarity"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgresql://clarity:clarity@db:5432/clarity
      APP_URL: http://localhost:8787
      PORT: 8787
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  clarity-db:
